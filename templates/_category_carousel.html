<section class="category-carousel-section">
    {% if show_title|default(true) %}
        <h2 class="section-title">{{ section_title|default(t('catalog.section_title')) }}</h2>
    {% endif %}
    <div class="category-carousel">
        {% for cat_slug in cats|default(category_order) %}
        <a href="{{ url_for('category_view', cat_slug=cat_slug) }}"
           class="category-card"
           style="background-image: url('{{ category_image_url(cat_slug) }}');">
            <div class="category-card-overlay">
                <h3>{{ t('category.' + cat_slug + '.name') }}</h3>
                <p class="category-card-desc">{{ t('category.' + cat_slug + '.desc') }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
</section>
