{% extends "base.html" %}
{% block title %}Criar conta — TeuKit{% endblock %}

{% block content %}
<section class="auth-page">
    <h1>{{ t('auth.register_title') }}</h1>
    <form method="POST" class="checkout-form auth-form">
        <label for="name">{{ t('auth.full_name') }}</label>
        <input type="text" id="name" name="name" required>

        <label for="email">{{ t('auth.email') }}</label>
        <input type="email" id="email" name="email" required>

        <label for="password">{{ t('auth.password') }}</label>
        <input type="password" id="password" name="password" minlength="6" required>
        <small class="field-hint">{{ t('auth.password_hint') }}</small>

        <button type="submit" class="btn btn-primary btn-large">{{ t('auth.register_button') }}</button>
    </form>
    <p class="auth-switch">{{ t('auth.have_account') }} <a href="{{ url_for('login') }}">{{ t('auth.login_title') }}</a></p>
</section>
{% endblock %}
