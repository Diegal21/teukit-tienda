{% extends "base.html" %}
{% block title %}Iniciar sessão — TeuKit{% endblock %}

{% block content %}
<section class="auth-page">
    <h1>{{ t('auth.login_title') }}</h1>
    <form method="POST" class="checkout-form auth-form">
        <label for="email">{{ t('auth.email') }}</label>
        <input type="email" id="email" name="email" required autofocus>

        <label for="password">{{ t('auth.password') }}</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary btn-large">{{ t('auth.login_button') }}</button>
    </form>
    <p class="auth-switch">{{ t('auth.no_account') }} <a href="{{ url_for('register') }}">{{ t('auth.create_account_link') }}</a></p>
</section>
{% endblock %}
