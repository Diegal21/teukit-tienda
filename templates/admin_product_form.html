{% extends "base.html" %}
{% block title %}Novo produto — TeuKit{% endblock %}

{% block content %}
<div class="admin-header">
    <h1>Novo produto</h1>
    <a href="{{ url_for('admin_products') }}" class="btn btn-small">Voltar</a>
</div>

<div class="order-card">
    <form action="{{ url_for('admin_new_product') }}" method="POST" enctype="multipart/form-data" class="product-edit-form">
        <div class="field-row">
            <label for="name">Nome do produto</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="field-row">
            <label for="price">Preço (€)</label>
            <input type="text" id="price" name="price" placeholder="ex: 39,90" required>
        </div>

        <div class="field-row">
            <label for="discount_percent">Desconto promocional (%)</label>
            <input type="number" id="discount_percent" name="discount_percent" min="0" max="90" value="0" placeholder="ex: 20">
            <small class="field-hint">Deixa em 0 para não aplicar desconto.</small>
        </div>

        <div class="field-row">
            <label for="category">Categoria</label>
            <select id="category" name="category" required>
                <optgroup label="Kits para clientes">
                    <option value="kit_emergencia">Kit de Emergência</option>
                    <option value="kit_incendios">Kit de Incêndios</option>
                    <option value="kit_viajes">Kit de Viagens</option>
                    <option value="kit_automovil">Kit para Automóvel</option>
                </optgroup>
                <optgroup label="Soluções para Empresas">
                    <option value="nfc_resenas">Cartões NFC de Avaliações</option>
                    <option value="menu_digital">Menu Digital QR/NFC</option>
                    <option value="kit_incendio_hospedagem">Kit de Incêndio p/ Hospedagem</option>
                </optgroup>
            </select>
        </div>

        <div class="field-row">
            <label for="stock">Stock inicial</label>
            <input type="number" id="stock" name="stock" min="0" value="10" required>
        </div>

        <div class="field-row">
            <label for="description">Conteúdo do kit / descrição</label>
            <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <div class="field-row">
            <label for="image">Imagem do produto</label>
            <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp" required>
            <small class="field-hint">Formatos aceites: PNG, JPG, WEBP. Máximo 5MB.</small>
        </div>

        <button type="submit" class="btn btn-primary">Criar produto</button>
    </form>
</div>
{% endblock %}
